<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="description" content="A little something I made for you." />
<meta name="theme-color" content="#16060f" />
<link rel="icon" href="favicon.svg" type="image/svg+xml" />
<link rel="apple-touch-icon" href="favicon.svg" />
<title>For You</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=Dancing+Script:wght@600&display=swap" rel="stylesheet">

<!--
  ============================================================================
  READ ME FIRST — everything you can personalise lives in ONE place:
  scroll down to the "var CONFIG = {" block, just after the opening script tag.

  The single highest-impact edit: replace the entries in DETAILS with real,
  tiny, concrete things about her. "the way you hold the mug with both hands"
  beats "you're my favourite part of every day" every single time.
  ============================================================================
-->

<style>
  :root {
    --rose: #ff6b9d;
    --rose-soft: #ffb3cb;
    --rose-deep: #c2185b;
    --cream: #fff0f5;
    --glow: rgba(255, 107, 157, 0.55);
    --serif: "Playfair Display", Georgia, "Times New Roman", serif;
    --script: "Dancing Script", "Segoe Script", cursive;
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html, body {
    margin: 0;
    padding: 0;
    min-height: 100%;
    background: #16060f;
    color: var(--cream);
    font-family: var(--serif);
    overflow-x: hidden;
  }

  body {
    min-height: 100dvh;
    background:
      radial-gradient(circle at 20% 15%, rgba(194, 24, 91, 0.42), transparent 55%),
      radial-gradient(circle at 80% 85%, rgba(255, 107, 157, 0.30), transparent 55%),
      radial-gradient(circle at 50% 50%, rgba(120, 15, 60, 0.55), transparent 70%),
      linear-gradient(160deg, #1e0714 0%, #2d0a1c 45%, #14050e 100%);
    background-attachment: fixed;
  }

  /* ---------- layers ---------- */
  #photos {
    position: fixed;
    inset: 0;
    z-index: 0;
    pointer-events: none;
    opacity: 0;
    transition: opacity 2.2s ease;
  }
  body.has-photos #photos { opacity: 1; }

  #photos .photo {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: center 32%;
    opacity: 0;
    transition: opacity 2s ease;
    transform: scale(1.0);
  }
  #photos .photo.on {
    opacity: 1;
    animation: kenburns 9s ease-out both;
  }
  /* Gentle zoom only — a large scale-up softens detail, so keep it subtle. */
  @keyframes kenburns {
    from { transform: scale(1.00); }
    to   { transform: scale(1.05); }
  }

  /* readability scrim over the photos — light enough to actually see them.
     The letter carries its own backdrop, so this only needs to take the
     harshest edge off for the hero and closing text. */
  #photos::after {
    content: "";
    position: absolute;
    inset: 0;
    background:
      radial-gradient(circle at 50% 50%, rgba(22, 6, 15, 0.12), rgba(22, 6, 15, 0.55) 75%),
      linear-gradient(180deg, rgba(22, 6, 15, 0.40), rgba(22, 6, 15, 0.24));
  }

  #bg { position: fixed; inset: 0; z-index: 1; pointer-events: none; }
  #fx { position: fixed; inset: 0; z-index: 60; pointer-events: none; }

  .wrap {
    position: relative;
    z-index: 10;
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 32px 20px calc(32px + env(safe-area-inset-bottom));
    text-align: center;
  }

  .scene { display: none; width: 100%; max-width: 680px; }
  .scene.on { display: flex; flex-direction: column; align-items: center; gap: 24px; animation: fadeUp 1.1s ease both; }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(22px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  /* ---------- scene 1: the heart ---------- */
  .hint {
    font-size: 0.78rem;
    letter-spacing: 0.34em;
    text-transform: uppercase;
    color: var(--rose-soft);
    opacity: 0.9;
    text-shadow: 0 2px 14px rgba(0,0,0,0.7);
  }

  .heart-btn {
    position: relative;
    width: 168px;
    height: 168px;
    border: none;
    background: none;
    cursor: pointer;
    padding: 0;
    animation: beat 1.5s ease-in-out infinite;
    filter: drop-shadow(0 0 30px var(--glow));
  }
  .heart-btn svg { width: 100%; height: 100%; display: block; }

  @keyframes beat {
    0%, 100% { transform: scale(1); }
    14%      { transform: scale(1.10); }
    28%      { transform: scale(1); }
    42%      { transform: scale(1.06); }
    56%      { transform: scale(1); }
  }

  .heart-btn::after {
    content: "";
    position: absolute;
    inset: -18px;
    border-radius: 50%;
    border: 1px solid rgba(255, 179, 203, 0.32);
    animation: halo 2.6s ease-out infinite;
  }
  @keyframes halo {
    0%   { transform: scale(0.85); opacity: 0.9; }
    100% { transform: scale(1.35); opacity: 0; }
  }

  .open-label {
    font-family: var(--script);
    font-size: clamp(1.7rem, 7vw, 2.4rem);
    color: #fff;
    text-shadow: 0 0 26px var(--glow), 0 2px 12px rgba(0,0,0,0.6);
  }

  /* ---------- scene 2: the letter ---------- */
  .letter {
    width: 100%;
    text-align: left;
    background: linear-gradient(180deg, rgba(30, 7, 20, 0.62), rgba(30, 7, 20, 0.44));
    border: 1px solid rgba(255, 179, 203, 0.26);
    border-radius: 20px;
    padding: clamp(24px, 6vw, 44px);
    backdrop-filter: blur(12px) saturate(1.1);
    -webkit-backdrop-filter: blur(12px) saturate(1.1);
    box-shadow: 0 26px 70px rgba(0, 0, 0, 0.58), inset 0 1px 0 rgba(255, 255, 255, 0.08);
  }

  .letter p {
    margin: 0 0 1.05em;
    font-size: clamp(1.02rem, 3.9vw, 1.20rem);
    line-height: 1.78;
    color: #ffedf4;
    min-height: 1em;
    text-shadow: 0 1px 10px rgba(0,0,0,0.55);
  }
  .letter p:last-of-type { margin-bottom: 0; }

  /* **emphasis** in the letter body */
  .letter strong {
    font-weight: 600;
    color: #fff;
  }

  .letter .sign {
    font-family: var(--script);
    font-size: clamp(1.6rem, 6vw, 2.1rem);
    color: var(--rose-soft);
    margin-top: 0.5em;
    text-align: right;
    text-shadow: 0 0 20px var(--glow);
  }

  .caret {
    display: inline-block;
    width: 2px;
    height: 1.05em;
    margin-left: 3px;
    vertical-align: -0.15em;
    background: var(--rose);
    box-shadow: 0 0 10px var(--rose);
    animation: blink 1s step-end infinite;
  }
  @keyframes blink { 50% { opacity: 0; } }

  .skip {
    font-size: 0.7rem;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: rgba(255, 179, 203, 0.6);
    background: none;
    border: none;
    cursor: pointer;
    font-family: var(--serif);
    padding: 8px;
  }
  .skip:hover { color: var(--rose-soft); }

  /* ---------- voice note ---------- */
  .voice {
    display: none;
    align-items: center;
    gap: 14px;
    width: 100%;
    max-width: 420px;
    padding: 12px 18px;
    border-radius: 999px;
    background: rgba(30, 7, 20, 0.66);
    border: 1px solid rgba(255, 179, 203, 0.3);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    box-shadow: 0 14px 40px rgba(0,0,0,0.45);
  }
  body.has-voice .voice { display: flex; animation: fadeUp 1s ease both; }

  .voice-btn {
    flex: 0 0 auto;
    width: 46px;
    height: 46px;
    border-radius: 50%;
    border: none;
    cursor: pointer;
    background: linear-gradient(135deg, var(--rose), var(--rose-deep));
    color: #fff;
    font-size: 1rem;
    line-height: 1;
    display: grid;
    place-items: center;
    box-shadow: 0 0 22px var(--glow);
    transition: transform 0.2s;
  }
  .voice-btn:hover { transform: scale(1.08); }
  .voice-btn.playing { animation: beat 1.5s ease-in-out infinite; }

  .voice-body { flex: 1 1 auto; text-align: left; min-width: 0; }
  .voice-label {
    font-size: 0.7rem;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--rose-soft);
    margin-bottom: 7px;
  }
  .voice-track {
    height: 4px;
    border-radius: 4px;
    background: rgba(255, 179, 203, 0.22);
    overflow: hidden;
  }
  .voice-fill {
    height: 100%;
    width: 0%;
    border-radius: 4px;
    background: linear-gradient(90deg, var(--rose-soft), var(--rose));
    box-shadow: 0 0 12px var(--glow);
    transition: width 0.2s linear;
  }

  /* ---------- scene 3: the question ---------- */
  .ask {
    font-family: var(--script);
    font-size: clamp(2rem, 9vw, 3.2rem);
    line-height: 1.25;
    color: #fff;
    text-shadow: 0 0 34px var(--glow), 0 2px 14px rgba(0,0,0,0.6);
  }

  .row {
    display: flex;
    gap: 18px;
    align-items: center;
    justify-content: center;
    flex-wrap: wrap;
    min-height: 76px;
  }

  .btn {
    font-family: var(--serif);
    font-size: 1.02rem;
    letter-spacing: 0.06em;
    border-radius: 999px;
    padding: 15px 40px;
    cursor: pointer;
    border: 1px solid var(--rose);
    transition: transform 0.25s cubic-bezier(.34,1.56,.64,1), box-shadow 0.25s, background 0.25s, opacity 0.5s;
  }

  .yes {
    background: linear-gradient(135deg, var(--rose), var(--rose-deep));
    color: #fff;
    box-shadow: 0 0 36px var(--glow);
  }
  .yes:hover { transform: scale(1.07); box-shadow: 0 0 54px var(--glow); }

  .no {
    background: rgba(255, 240, 245, 0.07);
    color: var(--rose-soft);
    border-color: rgba(255, 179, 203, 0.4);
  }

  /* ---------- scene 4: final + reasons jar ---------- */
  .final {
    font-family: var(--script);
    font-size: clamp(2.3rem, 11vw, 4rem);
    color: #fff;
    text-shadow: 0 0 44px var(--glow), 0 2px 16px rgba(0,0,0,0.6);
    animation: fadeUp 1.4s ease both;
  }
  .final-sub {
    font-size: clamp(0.95rem, 3.4vw, 1.1rem);
    color: var(--rose-soft);
    letter-spacing: 0.06em;
    animation: fadeUp 1.4s 0.5s ease both;
  }

  .jar { width: 100%; max-width: 560px; margin-top: 12px; animation: fadeUp 1.4s 1s ease both; }

  .jar-btn {
    font-family: var(--serif);
    font-size: 0.98rem;
    letter-spacing: 0.05em;
    padding: 14px 34px;
    border-radius: 999px;
    cursor: pointer;
    color: #fff;
    background: rgba(255, 240, 245, 0.08);
    border: 1px solid rgba(255, 179, 203, 0.5);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    transition: transform 0.22s, background 0.22s, box-shadow 0.22s;
  }
  .jar-btn:hover {
    transform: translateY(-2px);
    background: rgba(255, 179, 203, 0.16);
    box-shadow: 0 0 30px rgba(255, 107, 157, 0.35);
  }
  .jar-btn:active { transform: scale(0.97); }

  .reason {
    margin-top: 22px;
    min-height: 2.6em;
    font-size: clamp(1.05rem, 4.1vw, 1.32rem);
    line-height: 1.6;
    color: #fff;
    font-style: italic;
    text-shadow: 0 0 24px rgba(255, 107, 157, 0.5), 0 2px 12px rgba(0,0,0,0.6);
    opacity: 0;
    transform: translateY(10px);
    transition: opacity 0.5s ease, transform 0.5s ease;
  }
  .reason.in { opacity: 1; transform: translateY(0); }
  .reason::before {
    content: "\201C";
    font-size: 1.6em;
    line-height: 0;
    vertical-align: -0.35em;
    color: var(--rose);
    margin-right: 4px;
  }
  .reason::after {
    content: "\201D";
    font-size: 1.6em;
    line-height: 0;
    vertical-align: -0.35em;
    color: var(--rose);
    margin-left: 2px;
  }

  .replay {
    font-size: 0.7rem;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: rgba(255, 179, 203, 0.55);
    background: none;
    border: none;
    cursor: pointer;
    font-family: var(--serif);
    padding: 10px;
    margin-top: 10px;
  }
  .replay:hover { color: var(--rose-soft); }

  @media (prefers-reduced-motion: reduce) {
    * { animation-duration: 0.001s !important; animation-iteration-count: 1 !important; }
  }
</style>
</head>
<body>

<div id="photos"></div>
<canvas id="bg"></canvas>
<canvas id="fx"></canvas>

<div class="wrap">

  <!-- 1. tap to open -->
  <section class="scene on" id="s1">
    <div class="hint">A little something for you</div>
    <button class="heart-btn" id="openBtn" aria-label="Open the letter">
      <svg viewBox="0 0 100 100" aria-hidden="true">
        <defs>
          <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#ff8fb8"/>
            <stop offset="55%" stop-color="#ff4d85"/>
            <stop offset="100%" stop-color="#b1124f"/>
          </linearGradient>
        </defs>
        <path fill="url(#g)" d="M50 88S8 60 8 34.5C8 20.5 18.6 10 31.5 10 40 10 46.6 14.6 50 21.2 53.4 14.6 60 10 68.5 10 81.4 10 92 20.5 92 34.5 92 60 50 88 50 88Z"/>
      </svg>
    </button>
    <div class="open-label">Tap to open</div>
  </section>

  <!-- 2. the letter -->
  <section class="scene" id="s2">
    <div class="voice" id="voiceWrap">
      <button class="voice-btn" id="voiceBtn" aria-label="Play voice note">&#9654;</button>
      <div class="voice-body">
        <div class="voice-label">Press play &mdash; it&rsquo;s my voice</div>
        <div class="voice-track"><div class="voice-fill" id="voiceFill"></div></div>
      </div>
    </div>

    <div class="letter" id="letter">
      <p data-cursor></p>
    </div>
    <button class="skip" id="skipBtn">skip ahead &rarr;</button>
  </section>

  <!-- 3. the question -->
  <section class="scene" id="s3">
    <div class="ask">So&hellip; one more thing.<br>Will you keep being mine?</div>
    <div class="row" id="btnRow">
      <button class="btn yes" id="yesBtn">Yes &#128149;</button>
      <button class="btn no" id="noBtn">No</button>
    </div>
  </section>

  <!-- 4. the payoff + the reasons jar -->
  <section class="scene" id="s4">
    <div class="final">I love you.</div>
    <div class="final-sub">Today, tomorrow, and every ordinary day after.</div>

    <div class="jar">
      <button class="jar-btn" id="jarBtn">Pull a reason &#128140;</button>
      <div class="reason" id="reasonOut"></div>
    </div>

    <button class="replay" id="replayBtn">read it again</button>
  </section>

  <audio id="voice" preload="metadata"></audio>
</div>

<script>
/* ============================================================================
   EDIT ME — that's it, this is the only block you need to touch.
   ============================================================================ */
var CONFIG = {

  // --- NAMES -----------------------------------------------------------
  // She gets greeted with HER_NAME + "," below. Leave "" to fall back to "My love,".
  HER_NAME:  "My love",
  // Your name goes on the signature: "— Always yours, <YOUR_NAME>"
  YOUR_NAME: "",


  // --- YOUR VOICE (the single most powerful thing on this page) --------
  // Record a voice note on your phone, name the file exactly "voice.mp3",
  // and drop it in the SAME FOLDER as this file. Then leave this line as-is.
  // No file? The player simply never appears. Nothing breaks.
  VOICE_SRC: "voice.mp3",


  // --- PHOTOS ----------------------------------------------------------
  // Make a folder called "photos" next to this file and drop images in.
  // Leave the array empty ([]) to skip photos entirely.
  PHOTOS: [
    "photos/1.jpg",
    "photos/2.jpg",
    "photos/3.jpg",
    "photos/4.jpg",
    "photos/5.jpg",
    "photos/6.jpg",
    "photos/7.jpg",
    "photos/8.jpg",
    "photos/9.jpg",
    "photos/10.jpg",
    "photos/11.jpg",
    "photos/12.jpg",
    "photos/13.jpg",
    "photos/14.jpg",
    "photos/15.jpg",
    "photos/16.jpg",
    "photos/17.jpg",
    "photos/18.jpg",
    "photos/19.jpg",
    "photos/20.jpg",
    "photos/21.jpg",
    "photos/22.jpg",
  ],


  // --- REAL DETAILS  <<< HIGHEST IMPACT EDIT ON THIS WHOLE PAGE >>> -----
  // These become a paragraph in the letter. Be TINY and SPECIFIC.
  // Bad:  "You are my everything."
  // Good: "I love that you narrate what the dog is thinking."
  // Any line starting with "TODO:" is skipped, so nothing embarrassing ships.
  DETAILS: [
    "TODO: I love that you [something tiny and specific she does].",
    "TODO: I love how you [a small habit only you would notice].",
    "TODO: I still think about the time we [a moment only the two of you know].",
  ],


  // --- THE REASONS JAR -------------------------------------------------
  // She taps the button, gets one at random, forever. This is the part that
  // keeps the page worth re-opening. Replace these with your own.
  REASONS: [
    "You laugh with your whole face, not just your mouth.",
    "You make ordinary Tuesdays feel like something worth remembering.",
    "You listen like you actually want the answer.",
    "You are the only person I want to tell good news to first.",
    "You are gentle with people who can't do anything for you.",
    "You make me want to be someone worth being loved by.",
    "The way you get excited about small things is my favourite show.",
    "You say sorry properly, and you mean it.",
    "You always notice when I've gone quiet.",
    "You are stubborn in exactly the right places.",
    "You make bad days survivable just by being reachable.",
    "You never make me feel silly for caring about something.",
    "Your hugs are the only cure for a truly terrible day.",
    "You still get shy about compliments, after all this time.",
    "You defend the people you love without hesitating.",
    "You make me laugh in the middle of arguments. It's infuriating.",
    "You remember the tiny things I mention once.",
    "You are the calm in every room you walk into.",
    "You are curious about everything, and it's contagious.",
    "You love me on the days I'm hard to love.",
  ]
};

/* ============================================================================
   Everything below this line is the machinery. You don't need to change it.
   ============================================================================ */
(function () {
  "use strict";

  var reduced = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  var COLORS = ["#ff6b9d", "#ff8fb8", "#ffb3cb", "#ff4d85", "#ffffff", "#ffd9e6"];

  var HER = (CONFIG.HER_NAME  || "").trim();
  var YOU = (CONFIG.YOUR_NAME || "").trim();

  if (HER) document.title = "For you, " + HER;

  /* ============ canvases ============ */
  var bg = document.getElementById("bg");
  var bctx = bg.getContext("2d");
  var fx = document.getElementById("fx");
  var fctx = fx.getContext("2d");
  var W = 0, H = 0, dpr = 1;
  var drift = [], parts = [];

  function sizeCanvas(c) {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    c.width = Math.floor(window.innerWidth * dpr);
    c.height = Math.floor(window.innerHeight * dpr);
    c.style.width = window.innerWidth + "px";
    c.style.height = window.innerHeight + "px";
  }

  function heartPath(ctx, x, y, s) {
    ctx.beginPath();
    ctx.moveTo(x, y + s * 0.32);
    ctx.bezierCurveTo(x, y, x - s * 0.5, y, x - s * 0.5, y + s * 0.3);
    ctx.bezierCurveTo(x - s * 0.5, y + s * 0.62, x, y + s * 0.86, x, y + s);
    ctx.bezierCurveTo(x, y + s * 0.86, x + s * 0.5, y + s * 0.62, x + s * 0.5, y + s * 0.3);
    ctx.bezierCurveTo(x + s * 0.5, y, x, y, x, y + s * 0.32);
    ctx.closePath();
  }

  function newFlake(spread) {
    return {
      x: Math.random() * W,
      y: spread ? Math.random() * H : H + 40,
      s: 8 + Math.random() * 26,
      vy: 0.18 + Math.random() * 0.55,
      vx: (Math.random() - 0.5) * 0.30,
      a: 0.06 + Math.random() * 0.20,
      rot: (Math.random() - 0.5) * 0.5,
      rotV: (Math.random() - 0.5) * 0.006,
      color: Math.random() < 0.35 ? "#ffffff" : "#ff6b9d"
    };
  }

  function initDrift() {
    sizeCanvas(bg);
    sizeCanvas(fx);
    W = window.innerWidth; H = window.innerHeight;
    var count = reduced ? 12 : Math.round(Math.min(46, (W * H) / 26000));
    drift = [];
    for (var i = 0; i < count; i++) drift.push(newFlake(true));
  }

  function drawDrift() {
    bctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    bctx.clearRect(0, 0, W, H);
    for (var i = 0; i < drift.length; i++) {
      var f = drift[i];
      f.y -= f.vy;
      f.x += f.vx + Math.sin(f.y * 0.006) * 0.28;
      f.rot += f.rotV;
      if (f.y < -60) { drift[i] = newFlake(false); continue; }
      bctx.save();
      bctx.translate(f.x, f.y);
      bctx.rotate(f.rot);
      bctx.globalAlpha = f.a;
      bctx.fillStyle = f.color;
      bctx.shadowColor = f.color;
      bctx.shadowBlur = 18;
      heartPath(bctx, 0, -f.s / 2, f.s);
      bctx.fill();
      bctx.restore();
    }
  }

  function burst(x, y, n) {
    if (reduced) n = Math.min(n, 6);
    for (var i = 0; i < n; i++) {
      var ang = Math.random() * Math.PI * 2;
      var spd = 2.4 + Math.random() * 6.4;
      parts.push({
        x: x, y: y,
        vx: Math.cos(ang) * spd,
        vy: Math.sin(ang) * spd - 2.2,
        s: 8 + Math.random() * 17,
        rot: Math.random() * Math.PI * 2,
        rotV: (Math.random() - 0.5) * 0.28,
        life: 1,
        decay: 0.008 + Math.random() * 0.013,
        color: COLORS[(Math.random() * COLORS.length) | 0]
      });
    }
  }

  function drawParts() {
    fctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    fctx.clearRect(0, 0, W, H);
    for (var i = parts.length - 1; i >= 0; i--) {
      var p = parts[i];
      p.vy += 0.19;
      p.vx *= 0.992;
      p.vy *= 0.992;
      p.x += p.vx;
      p.y += p.vy;
      p.rot += p.rotV;
      p.life -= p.decay;
      if (p.life <= 0 || p.y > H + 80) { parts.splice(i, 1); continue; }
      fctx.save();
      fctx.translate(p.x, p.y);
      fctx.rotate(p.rot);
      fctx.globalAlpha = Math.max(0, Math.min(1, p.life));
      fctx.fillStyle = p.color;
      fctx.shadowColor = p.color;
      fctx.shadowBlur = 14;
      heartPath(fctx, 0, -p.s / 2, p.s);
      fctx.fill();
      fctx.restore();
    }
  }

  function loop() {
    drawDrift();
    drawParts();
    requestAnimationFrame(loop);
  }

  /* ============ photos ============ */
  var slides = [], slideIdx = 0, slideTimer = null;

  function initPhotos() {
    var box = document.getElementById("photos");
    var list = (CONFIG.PHOTOS || []).filter(function (s) { return !!s; });
    if (!list.length) return;

    var pending = list.length;

    list.forEach(function (src) {
      var img = new Image();
      img.className = "photo";
      img.alt = "";
      img.decoding = "async";

      img.onload = function () {
        box.appendChild(img);
        slides.push(img);
        document.body.classList.add("has-photos");
        if (slides.length === 1) {
          img.classList.add("on");
          startSlideshow();
        }
        if (--pending === 0 && slides.length) startSlideshow();
      };

      img.onerror = function () { --pending; }; // missing file -> just skipped
      img.src = src;
    });
  }

  function startSlideshow() {
    if (slideTimer || slides.length < 2) return;
    slideTimer = setInterval(function () {
      slides[slideIdx].classList.remove("on");
      slideIdx = (slideIdx + 1) % slides.length;
      slides[slideIdx].classList.add("on");
    }, 7000);
  }

  /* ============ voice note ============ */
  var audio = document.getElementById("voice");
  var voiceBtn = document.getElementById("voiceBtn");
  var voiceFill = document.getElementById("voiceFill");

  function initVoice() {
    if (!CONFIG.VOICE_SRC) return;
    audio.src = CONFIG.VOICE_SRC;

    audio.addEventListener("loadedmetadata", function () {
      document.body.classList.add("has-voice");
    });

    // no file, or unplayable -> hide the player, never show a broken button
    audio.addEventListener("error", function () {
      document.body.classList.remove("has-voice");
    });

    audio.addEventListener("timeupdate", function () {
      if (!audio.duration) return;
      voiceFill.style.width = (audio.currentTime / audio.duration * 100) + "%";
    });

    audio.addEventListener("play", function () {
      voiceBtn.classList.add("playing");
      voiceBtn.innerHTML = "&#10074;&#10074;";
    });

    function reset() {
      voiceBtn.classList.remove("playing");
      voiceBtn.innerHTML = "&#9654;";
    }
    audio.addEventListener("pause", reset);
    audio.addEventListener("ended", function () { reset(); voiceFill.style.width = "0%"; });

    voiceBtn.addEventListener("click", function () {
      if (audio.paused) {
        var pr = audio.play();
        if (pr && pr.catch) pr.catch(function () { /* blocked; she can tap again */ });
      } else {
        audio.pause();
      }
    });
  }

  // Try to start the voice note on her first tap (allowed, since it's a gesture).
  function tryAutoplayVoice() {
    if (!document.body.classList.contains("has-voice")) return;
    var pr = audio.play();
    if (pr && pr.catch) pr.catch(function () { /* she can press play herself */ });
  }

  /* ============ the letter ============ */
  function buildParagraphs() {
    var out = [];

    out.push(HER ? HER + "," : "My love,");

    out.push("I don't know if I'll ever find the perfect words for what you mean to me, but I'll spend as long as it takes trying.");

    out.push("There are so many little things about you that I love. Things you probably don't even realise I notice. The way you smile when you're genuinely happy. The way your voice changes when you're excited about something. The little expressions you make without thinking. The way you can turn an ordinary moment into something I'll remember for a long time.");

    var details = (CONFIG.DETAILS || []).filter(function (d) {
      return d && !/^\s*TODO:/i.test(d);   // unfilled placeholders are silently skipped
    });
    if (details.length) out.push(details.join(" "));

    out.push("And somehow, somewhere along the way, you became my favourite person.");

    out.push("Not because you're perfect. Not because every day with you is perfect. But because **you're you**.");

    out.push("I love the person you are when you're happy, but I also love the person you are when you're tired, quiet, stressed, or having a difficult day. You never have to pretend to be okay around me. You never have to be perfect for me.");

    out.push("You can simply be yourself.");

    out.push("And I'll still be here.");

    out.push("Sometimes I wonder if you truly understand how much space you have in my heart. You appear in my thoughts when I wake up, in the little things I see throughout the day, and in the quiet moments before I fall asleep.");

    out.push("Even when we're not talking, somehow, you're still there.");

    out.push("You have become part of the way I see the world.");

    out.push("A beautiful song reminds me of you. A random little moment makes me wish you were there. Something funny happens and you're the first person I want to tell. And when something hurts, you're the person I want beside me.");

    out.push("That's when I realised something.");

    out.push("**I don't just want you in my happiest moments. I want you in my ordinary ones too.**");

    out.push("I want the sleepy mornings. The random conversations. The stupid jokes that make no sense to anyone else. The quiet nights. The little arguments we'll eventually laugh about. The days when everything goes right. And even the days when everything goes wrong.");

    out.push("I want all of it.");

    out.push("With you.");

    out.push("And if one day you forget how loved you are, I hope you come back to these words.");

    out.push("Because I want you to remember that somewhere in this world, there is someone who looks at you and thinks:");

    out.push("**\u201cHow did I get so lucky to have you?\u201d**");

    out.push("Someone who is grateful for every conversation, every laugh, every memory, every little moment that brought us closer.");

    out.push("Someone who doesn't love some perfect version of you.");

    out.push("**I love the real you.**");

    out.push("The you who laughs too much. The you who overthinks. The you who gets annoyed. The you who gets quiet. The you who needs reassurance. The you who sometimes doesn't know what to say.");

    out.push("All of you.");

    out.push("And if life ever gets difficult, I don't want you to wonder whether I'll still care.");

    out.push("I will.");

    out.push("If you have a bad day, I'll still love you. If you're struggling, I'll still choose you. If you feel lost, I'll stay close. If you forget how special you are, I'll remind you.");

    out.push("Because loving you isn't something I only want to do when things are easy.");

    out.push("**I want to love you through everything.**");

    out.push("I don't know what the future will look like.");

    out.push("But if I get to choose who I want beside me while I find out...");

    out.push("**I choose you.**");

    out.push("Today. Tomorrow. On the ordinary days. On the difficult days. And on every beautiful day we haven't reached yet.");

    out.push("So, my love... If you ever wonder what you mean to me, remember this:");

    out.push("**You are not just someone I love.**");

    out.push("You are someone I think about when I imagine happiness. You are someone I want to make memories with. You are someone I want to come home to. And somehow, out of all the people in this enormous world, **my heart found you**.");

    out.push("And I hope it never stops choosing you. \u2764\ufe0f");

    return out;
  }

  // Split a paragraph on ** markers into { bold, text } runs, so the typewriter
  // can emit real <strong> spans instead of printing asterisks.
  function parseRich(s) {
    var segs = [], buf = "", bold = false;
    for (var i = 0; i < s.length; i++) {
      if (s.charAt(i) === "*" && s.charAt(i + 1) === "*") {
        if (buf) { segs.push({ bold: bold, text: buf }); buf = ""; }
        bold = !bold;
        i++;
      } else {
        buf += s.charAt(i);
      }
    }
    if (buf) segs.push({ bold: bold, text: buf });
    return segs;
  }

  var PARAGRAPHS = buildParagraphs();
  var RICH = PARAGRAPHS.map(parseRich);

  // Roughly how long the whole letter should take to type out, in ms.
  // Lower this number to make it faster, raise it to slow it down.
  var TYPE_TARGET_MS = 14000;

  // A long letter shouldn't take a minute and a half to type out, so shrink the
  // per-character delay to keep the whole thing near TYPE_TARGET_MS. Short
  // letters keep the full deliberate pace (the cap at 1 never speeds those up).
  var SPEED = (function () {
    var chars = RICH.reduce(function (n, segs) {
      return n + segs.reduce(function (m, s) { return m + s.text.length; }, 0);
    }, 0);
    // ~1.7x overhead covers comma/stop pauses and the gaps between paragraphs.
    return Math.min(1, TYPE_TARGET_MS / (chars * 24 * 1.7));
  })();
  var SIGNATURE = YOU ? "\u2014 Always yours, " + YOU : "\u2014 Always yours";

  var letter = document.getElementById("letter");
  var typing = false, done = false;

  function cursorEl() {
    var c = document.createElement("span");
    c.className = "caret";
    return c;
  }

  function typewrite() {
    if (typing || done) return;
    typing = true;

    // reuse the placeholder paragraph so no blank line is left behind
    var p = letter.querySelector("p");
    if (!p) { p = document.createElement("p"); letter.appendChild(p); }
    var caret = cursorEl();
    p.appendChild(caret);

    var pi = 0, si = 0, ci = 0, boldNode = null;

    function step() {
      if (pi >= RICH.length) {
        var sig = document.createElement("div");
        sig.className = "sign";
        sig.textContent = SIGNATURE;
        letter.appendChild(sig);
        if (caret.parentNode) caret.parentNode.removeChild(caret);
        done = true;
        typing = false;
        setTimeout(showQuestion, 1400);
        return;
      }

      var segs = RICH[pi];

      // move past any runs we've already typed out
      while (si < segs.length && ci >= segs[si].text.length) { si++; ci = 0; }

      if (si < segs.length) {
        var seg = segs[si];

        // first character of a run: bold runs get their own <strong>
        if (ci === 0) {
          boldNode = seg.bold ? document.createElement("strong") : null;
          if (boldNode) p.insertBefore(boldNode, caret);
        }

        var ch = seg.text.charAt(ci++);
        if (boldNode) boldNode.appendChild(document.createTextNode(ch));
        else caret.insertAdjacentText("beforebegin", ch);

        var d = 24 * SPEED;
        if (ch === ",") d = 120 * SPEED;
        if (ch === "." || ch === "\u2014") d = 240 * SPEED;
        setTimeout(step, d);
        return;
      }

      pi++;
      si = 0;
      ci = 0;
      boldNode = null;
      if (pi < RICH.length) {
        var next = document.createElement("p");
        var nc = cursorEl();
        next.appendChild(nc);
        letter.appendChild(next);
        if (caret.parentNode) caret.parentNode.removeChild(caret);
        caret = nc;
        p = next;
        // Only the paragraph beat keeps a floor — without it the 38 paragraphs
        // would run together and the letter would lose all its structure.
        setTimeout(step, Math.max(70, 400 * SPEED));
      } else {
        setTimeout(step, 300);
      }
    }

    step();
  }

  function finishInstantly() {
    if (done) return;
    done = true;
    typing = false;
    letter.innerHTML = "";
    RICH.forEach(function (segs) {
      var el = document.createElement("p");
      segs.forEach(function (s) {
        if (s.bold) {
          var b = document.createElement("strong");
          b.textContent = s.text;
          el.appendChild(b);
        } else {
          el.appendChild(document.createTextNode(s.text));
        }
      });
      letter.appendChild(el);
    });
    var sig = document.createElement("div");
    sig.className = "sign";
    sig.textContent = SIGNATURE;
    letter.appendChild(sig);
    showQuestion();
  }

  /* ============ scenes ============ */
  var scenes = {
    s1: document.getElementById("s1"),
    s2: document.getElementById("s2"),
    s3: document.getElementById("s3"),
    s4: document.getElementById("s4")
  };

  function show(id) {
    Object.keys(scenes).forEach(function (k) {
      scenes[k].classList.toggle("on", k === id);
    });
  }

  function showQuestion() {
    if (!scenes.s3.classList.contains("on")) {
      show("s3");
      var r = document.getElementById("btnRow").getBoundingClientRect();
      burst(W / 2, r.top || H * 0.65, 26);
    }
  }

  /* ============ the runaway "No" button ============ */
  var noBtn = document.getElementById("noBtn");
  var yesBtn = document.getElementById("yesBtn");
  var noCount = 0;
  var NO_LABELS = ["No", "Are you sure?", "Really sure?", "Think again\u2026", "Last chance!", "Surely not?", "You might regret this\u2026", "Give it one more thought", "Please?", "Don't do this to me \uD83E\uDD7A", "I'm going to cry\u2026"];

  function dodge() {
    noCount++;
    var s = Math.max(0.32, 1 - noCount * 0.13);
    noBtn.style.transform = "scale(" + s + ")";
    noBtn.textContent = NO_LABELS[Math.min(noCount, NO_LABELS.length - 1)];
    if (noCount >= NO_LABELS.length) {
      noBtn.style.opacity = "0";
      noBtn.style.pointerEvents = "none";
    }
    yesBtn.style.transform = "scale(" + Math.min(2.1, 1 + noCount * 0.1) + ")";
  }

  noBtn.addEventListener("mouseenter", dodge);
  noBtn.addEventListener("click", function (e) { e.preventDefault(); dodge(); });

  yesBtn.addEventListener("click", function () {
    show("s4");
    var r = yesBtn.getBoundingClientRect();
    burst(r.left + r.width / 2, r.top + r.height / 2, 46);
    var t = 0;
    var iv = setInterval(function () {
      burst(Math.random() * W, H * 0.35 + Math.random() * H * 0.5, 10);
      if (++t > 9) clearInterval(iv);
    }, 320);
    pullReason();
  });

  /* ============ the reasons jar ============ */
  var reasonOut = document.getElementById("reasonOut");
  var jarBtn = document.getElementById("jarBtn");
  var lastReason = -1;
  var usedCount = 0;
  var reasonTimer = null;

  function pullReason() {
    var list = (CONFIG.REASONS || []).filter(Boolean);
    if (!list.length) { jarBtn.style.display = "none"; return; }

    usedCount++;
    jarBtn.textContent = usedCount === 1 ? "One more \uD83D\uDC8C" : "Pull another \uD83D\uDC8C";
    if (list.length === 1) { lastReason = 0; }

    var i = lastReason;
    while (i === lastReason && list.length > 1) {
      i = (Math.random() * list.length) | 0;
    }
    lastReason = i;

    // only ever one pending swap, so fast tapping can't stack up animations
    reasonOut.classList.remove("in");
    if (reasonTimer) clearTimeout(reasonTimer);
    reasonTimer = setTimeout(function () {
      reasonOut.textContent = list[i];
      reasonOut.classList.add("in");
      var r = reasonOut.getBoundingClientRect();
      burst(r.left + r.width / 2, r.top + r.height / 2, 16);
    }, 260);
  }

  jarBtn.addEventListener("click", pullReason);

  /* ============ wiring ============ */
  document.getElementById("openBtn").addEventListener("click", function (e) {
    burst(e.clientX || W / 2, e.clientY || H / 2, 34);
    show("s2");
    setTimeout(tryAutoplayVoice, 300);
    setTimeout(typewrite, 700);
  });

  document.getElementById("skipBtn").addEventListener("click", finishInstantly);
  letter.addEventListener("click", finishInstantly);

  document.getElementById("replayBtn").addEventListener("click", function () {
    typing = false;
    done = false;
    letter.innerHTML = "<p></p>";
    show("s2");
    setTimeout(typewrite, 500);
  });

  // hearts follow every tap
  window.addEventListener("pointerdown", function (e) {
    burst(e.clientX, e.clientY, 9);
  });

  window.addEventListener("resize", initDrift);

  initDrift();
  initVoice();
  initPhotos();
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
